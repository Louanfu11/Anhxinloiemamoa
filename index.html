<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bảng Chữ Cái Kiểu Nghệ Thuật</title>
  <style>
    body {
      font-family: cursive, 'Comic Sans MS', Arial;
      text-align: center;
      background-image: url('https://tpny.vn/wp-content/uploads/2021/03/Background-dep-HD.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 40px;
    }

    h1 {
      font-size: 32px;
      font-weight: bold;
      font-style: italic;
      background: linear-gradient(to right, #ff00cc, #3333ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 2px 2px 3px white, 1px 1px 2px rgba(0,0,0,0.3);
      margin-bottom: 30px;
    }

    .letter-grid {
      display: grid;
      grid-template-columns: repeat(4, 60px);
      grid-auto-rows: 60px;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .letter {
      font-size: 28px;
      font-weight: bold;
      font-style: italic;
      background-color: transparent;
      border: none;
      padding: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(to right, #ff00cc, #3333ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow: 2px 2px 3px white, 1px 1px 2px rgba(0,0,0,0.3);
    }

    .letter:hover {
      transform: scale(1.2);
    }

    .message {
      font-size: 20px;
      color: green;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Chọn một chữ cái</h1>
  <div class="letter-grid" id="letterGrid"></div>
  <div class="message" id="message">Cảm ơn bạn</div>

  <script>
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const grid = document.getElementById('letterGrid');
    const message = document.getElementById('message');

    for (let i = 0; i < letters.length; i++) {
      const letter = document.createElement('div');
      letter.className = 'letter';
      letter.textContent = letters[i];
      letter.addEventListener('click', () => {
        message.style.display = 'block';
        message.textContent = `Cảm ơn bạn đã chọn chữ "${letters[i]}"`;
      });
      grid.appendChild(letter);
    }
  </script>

</body>
</html>
